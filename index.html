<style>
:root{
  --bg:#f1f8f3; --card:#ffffff; --ink:#12281c; --muted:#5a7364; --line:#dfece4;
  --brand:#15803d; --brand2:#22a06b; --brand-soft:#e4f4e8;
  --good:#166534; --bad:#b91c1c; --warn:#b45309;
  --good-bg:#dcf3e3; --bad-bg:#fee2e2; --warn-bg:#fef3c7; --brand-bg:#e4f4e8;
  --shadow:0 8px 28px rgba(20,80,40,.10); --radius:16px;
  --tint-a:.20; --tint-b:.75;   /* darkness of the green overlay on photos: 0 = none, 1 = solid */
}
[data-theme="dark"]{
  --bg:#0a1710; --card:#12261a; --ink:#e6f2ea; --muted:#8fb09a; --line:#1f3a2a;
  --brand:#4ade80; --brand2:#a3e635; --brand-soft:#14532d;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --good-bg:#12391f; --bad-bg:#4c1d1d; --warn-bg:#45320b; --brand-bg:#14532d;
  --shadow:0 8px 28px rgba(0,0,0,.4);
}
@font-face{font-family:'SinhalaFont';src:url('sinhala.woff2') format('woff2'),url('sinhala.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Inter','SinhalaFont','Noto Sans Sinhala','Nirmala UI','Iskoola Pota',system-ui,sans-serif;}
body{background:var(--bg); color:var(--ink); min-height:100vh; transition:background .25s, color .25s;}
a{color:var(--brand); text-decoration:none;}
header{position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:12px 20px;}
.logo{text-decoration:none;text-transform:uppercase;letter-spacing:.05em;font-weight:800; font-size:1.05rem; color:var(--ink); display:flex; align-items:center; gap:8px;}
.logo span{background:linear-gradient(120deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hdr-actions{display:flex; gap:8px; align-items:center;}
main{max-width:1040px; margin:0 auto; padding:24px 16px 80px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px;}
h1{font-size:1.5rem; letter-spacing:-.02em;}
h2{font-size:1.05rem; margin-bottom:14px;}
.sub{color:var(--muted); font-size:.9rem; margin-top:6px; line-height:1.6;}
label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:14px 0 5px;}
input,select{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:11px; font-size:.93rem; background:var(--bg); color:var(--ink);}
input:focus,select:focus{outline:none; border-color:var(--brand); background:var(--card);}
input.invalid{border-color:var(--bad);}
.btn{border:none; border-radius:11px; padding:11px 20px; font-weight:700; font-size:.92rem; cursor:pointer; transition:.15s; font-family:inherit;}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand2)); color:#fff; width:100%; margin-top:18px;}
.btn-primary:not(:disabled):hover{filter:brightness(1.08);}
.btn-ghost{background:var(--brand-bg); color:var(--brand);}
.btn-danger{background:var(--bad-bg); color:var(--bad);}
.btn-sm{padding:6px 13px; font-size:.8rem; border-radius:8px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.hero{padding:56px 28px; text-align:center;}
.hero .badge{display:inline-block; background:var(--brand-bg); color:var(--brand); font-weight:700; font-size:.75rem; letter-spacing:.08em;
  text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;}
.hero h1{font-size:2rem; margin-bottom:10px;}
.hero .sub{max-width:480px; margin:0 auto 26px;}
.hero-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.hero-btns .btn{width:auto; padding:13px 34px; margin:0;}
.auth-card{max-width:420px; margin:36px auto;}
.err{background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.ok{background:var(--good-bg); color:var(--good); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.field-err{color:var(--bad); font-size:.75rem; margin-top:4px; min-height:1em;}
.meter{height:6px; background:var(--line); border-radius:6px; margin-top:8px; overflow:hidden;}
.meter div{height:100%; border-radius:6px; transition:width .25s, background .25s;}
.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:15px; text-align:center;}
.stat .num{font-size:1.5rem; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:.75rem; color:var(--muted); margin-top:3px;}
table{width:100%; border-collapse:collapse; font-size:.88rem;}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--bg);}
tr:hover td{background:var(--bg);}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
.pill{display:inline-block; padding:3px 11px; border-radius:999px; font-size:.73rem; font-weight:700;}
.pill.good{background:var(--good-bg); color:var(--good);}
.pill.bad{background:var(--bad-bg); color:var(--bad);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.brand{background:var(--brand-bg); color:var(--brand);}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.tabs button{border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 18px; cursor:pointer; font-weight:700; font-size:.85rem; font-family:inherit;}
.tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
.row>div{flex:1; min-width:130px;}
.hint{font-size:.78rem; color:var(--muted); margin-top:10px; line-height:1.6;}
.switch{position:relative; width:42px; height:24px; display:inline-block; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:.2s;}
.slider:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--brand);}
.switch input:checked + .slider:before{transform:translateX(18px);}
.paper-row{display:flex; align-items:center; gap:14px; justify-content:space-between; flex-wrap:wrap; padding:13px 4px; border-bottom:1px solid var(--line);}
.paper-row:last-child{border-bottom:none;}
.bar-wrap{background:var(--line); border-radius:8px; height:8px; margin-top:6px; overflow:hidden;}
.bar{height:100%; border-radius:8px;}
canvas{max-height:320px;}
#loading{position:fixed; inset:0; background:rgba(10,20,28,.45); display:none; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px);}
#loading.show{display:flex;}
.spinner{width:44px; height:44px; border:4px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.list-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:.9rem;}
.list-item:last-child{border-bottom:none;}
.mono{font-variant-numeric:tabular-nums;}
.saved{color:var(--good); font-size:.78rem; font-weight:700;}
@media(max-width:600px){
  .hero{padding:40px 18px;} .hero h1{font-size:1.5rem;}
  .card{padding:18px;}
}
.marq{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;padding:10px 0;position:relative}
.marq-h{font-size:.72rem;font-weight:800;color:var(--brand);letter-spacing:.06em;padding:0 14px 6px}
.marq-track{display:flex;width:max-content;animation:marq 40s linear infinite}
.marq:hover .marq-track{animation-play-state:paused}
.marq-item{display:flex;align-items:center;gap:9px;padding:0 22px;white-space:nowrap}
.face{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:2px solid var(--brand)}
.marq-item small{display:block;color:var(--muted);font-size:.72rem}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq-track{animation:none}.marq{overflow-x:auto}}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:.85rem}
.chk input{width:auto}
.site-foot{text-align:center;padding:22px 14px 28px;color:var(--muted);font-size:.8rem}
.site-foot b{color:var(--brand)}
.vbadge{background:#dcfce7;color:#166534;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.nl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.nl:hover{color:var(--brand)}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.bgfx span{position:absolute;bottom:-70px;opacity:.15;animation:floatUp linear infinite;will-change:transform}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bgfx{display:none}}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);max-width:980px;margin:28px auto;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.split .auth-card{max-width:none;margin:0;border-radius:0;box-shadow:none}
.side{position:relative;min-height:320px;background:linear-gradient(rgba(6,45,25,var(--tint-a)),rgba(6,45,25,var(--tint-b))),url('signup-photo.jpg') center/cover no-repeat,linear-gradient(135deg,#15803d,#22a06b);display:flex;align-items:flex-end}
.side-txt{padding:28px;color:#fff}.side-txt h2{color:#fff;margin:6px 0}.side-txt p{margin:0;opacity:.9;font-size:.9rem}
@media (max-width:760px){.split{grid-template-columns:1fr;margin:12px auto}.side{min-height:150px}}
.hero.photo{background:linear-gradient(rgba(6,45,25,var(--tint-a)),rgba(6,45,25,var(--tint-b))),url('hero-photo.jpg') center/cover no-repeat,linear-gradient(135deg,#15803d,#22a06b);color:#fff;min-height:380px;display:flex;align-items:center;padding:40px 36px;border-radius:var(--radius)}
.hero.photo .hero-in{max-width:540px;width:100%}
.hero.photo h1,.hero.photo .sub{color:#fff}.hero.photo .sub{opacity:.92;margin:0 0 24px}
.hero.photo .badge{background:rgba(255,255,255,.18);color:#fff}
.hero.photo .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.65)}
.hero.pos-left{justify-content:flex-start;text-align:left}.hero.pos-left .hero-btns{justify-content:flex-start}
.hero.pos-center{justify-content:center;text-align:center}.hero.pos-center .hero-in{margin:0 auto}.hero.pos-center .sub{margin:0 auto 24px}
.hero.pos-right{justify-content:flex-end;text-align:right}.hero.pos-right .hero-btns{justify-content:flex-end}
@media (max-width:760px){.hero.photo{min-height:320px;padding:28px 18px}}
.foot-contact{display:inline-block;margin-bottom:10px;padding:8px 18px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;font-size:.85rem}
.foot-contact:hover{opacity:.9}
.crow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}.crow .ic{font-size:1.5rem;line-height:1}
.crow a{color:var(--brand);font-weight:700;text-decoration:none;word-break:break-word}
</style>

<body>

<header>
  <a class="logo" href="#/"><span>S.K. Wellala Biology Paper Class</span></a>
  <div class="hdr-actions" id="hdrActions"></div>
</header>
<main id="app"></main>
<footer class="site-foot"><a class="foot-contact" href="#/contact">📞 Contact us</a><br>Site developer: <b>Tharusha Lansakra</b> · S.K. Wellala Biology Paper Class</footer>
<div id="loading"><div class="spinner"></div></div>

<script src="features.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged,
         signOut, sendPasswordResetEmail, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
         collection, query, where, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b>0 ? Math.round(a/b*1000)/10 : 0;
const SUBJECTS = ["Biology"];
const BATCHES = ["2027 A/L","2028 A/L"];
// Standard A/L grade boundaries by %
const grade = p => p>=75?'A':p>=65?'B':p>=55?'C':p>=35?'S':'F';
const gCls  = p => p>=75?'good':p>=55?'brand':p>=35?'warn':'bad';
const NIC_RE = /^(\d{9}[VvXx]|\d{12})$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const busy = on => $("#loading").classList.toggle('show', !!on);
let charts = {};
function killCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={}; }
function friendly(e){
  const m={'auth/email-already-in-use':'This email is already registered. Try logging in instead.',
    'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect email or password.',
    'auth/user-not-found':'No account found with this email.','auth/invalid-email':'That email address does not look valid.',
    'auth/weak-password':'Password is too weak — use at least 8 characters with letters and numbers.',
    'auth/too-many-requests':'Too many attempts. Please wait a minute and try again.',
    'auth/network-request-failed':'Network error — check your internet connection.',
    'auth/missing-email':'Please enter your email address.'};
  return m[e.code] || e.message || 'Something went wrong. Please try again.';
}
function setTheme(t){ document.documentElement.dataset.theme=t; localStorage.setItem('ca_theme',t); chartDefaults(); }
function chartDefaults(){
  const dark = document.documentElement.dataset.theme==='dark';
  Chart.defaults.color = dark ? '#8fa6b3' : '#5b7280';
  Chart.defaults.borderColor = dark ? 'rgba(143,166,179,.15)' : 'rgba(91,114,128,.12)';
}
const themeBtn = () => `<button class="btn btn-ghost btn-sm" id="themeBtn">${document.documentElement.dataset.theme==='dark'?'☀️ Light':'🌙 Dark'}</button>`;
function bindTheme(){ const b=$("#themeBtn"); if(b) b.onclick=()=>{ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); route(); }; }

/* ============================== STATE ============================== */
let auth=null, db=null, user=null, role=null, profile=null;
let signingUp=false, authLoad=null;
let state = {batch:'2027 A/L',center:'All',rankPaper:null, tab:'marks', selPaper:null, stuSubject:'All', settings:null };
let unsubStu = null;
const AL = SUBJECTS.map(s=>({s,g:0,p:0,total:0})); // not used; kept minimal

/* ============================== ROUTER ============================== */
const routes = () => ({
  '':'landing', '#/':'landing', '#/login':'login', '#/signup':'signup', '#/forgot':'forgot',
  '#/dashboard':'stuDash', '#/contact':'contact', '#/teacher':'teacherAuth', '#/teacher/dashboard':'teacherDash'
});
window.addEventListener('hashchange', route);

function go(h){ if(location.hash===h) route(); else location.hash=h; }
window.CA={esc,pct,grade,gCls,SUBJECTS,BATCHES,app,go,busy,friendly,state,
  get role(){return role}, get user(){return user}, get profile(){return profile}, get db(){return db},
  fs:{doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,serverTimestamp},
  tabs:[],                                   // add-on files push {id,label,render(ctx)} here to add teacher tabs
  refresh:()=>route()};
function route(){
  if(unsubStu){ unsubStu(); unsubStu=null; }
  killCharts();
  const r = location.hash.startsWith('#/student/') ? 'studentView' : (routes()[location.hash] || 'landing');
  // guards
  if(r==='stuDash' && !(user && role==='student')) return go('#/login');
  if(r==='teacherDash' && !(user && role==='teacher')) return go('#/teacher');
  if(r==='studentView' && !(user && role==='teacher' && (profile.isAdmin||profile.verified===true))) return go('#/teacher');
  if(['landing','login','signup','forgot'].includes(r) && user && role==='student') return go('#/dashboard');
  if(r==='teacherAuth' && user && role==='teacher') return go('#/teacher/dashboard');
  renderHdr(r);
  ({landing,login,signup,forgot,stuDash,teacherAuth,teacherDash,studentView,contact})[r]();
  try{ document.dispatchEvent(new CustomEvent('ca:view',{detail:{name:r}})); }catch(e){}
  window.scrollTo(0,0);
}
function renderHdr(r){
  const h=$("#hdrActions");
  if(user && (r==='stuDash'||r==='teacherDash'||r==='studentView')){
    h.innerHTML = `<span class="pill brand">${role==='teacher'?(profile&&profile.isAdmin?'🛠 Developer':'👩‍🏫 Teacher'):'🎓 Student'}</span> ${themeBtn()} <button class="btn btn-danger btn-sm" id="logoutBtn">Log out</button>`;
    $("#logoutBtn").onclick = async ()=>{ if(unsubStu){unsubStu();unsubStu=null;} await signOut(auth); };
  } else {
    h.innerHTML = themeBtn();
  }
  bindTheme();
}

/* ============================== SETUP / BOOT ============================== */
function parseCfg(txt){
  // Accepts strict JSON OR the JS snippet Firebase shows: const firebaseConfig = { apiKey: "..", ... };
  let t=String(txt||'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw new Error('no braces');
  t=t.slice(a,b+1)
     .replace(/\/\/.*$/gm,'')                       // line comments
     .replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'")  // smart quotes
     .replace(/'([^']*)'/g,'"$1"')                  // single -> double quotes
     .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":') // quote bare keys
     .replace(/,\s*([}\]])/g,'$1');                // trailing commas
  return JSON.parse(t);
}
function setupScreen(msg){
  app.innerHTML = `<div class="card auth-card">
    <h2>🔧 One-time Setup</h2>
    <p class="sub">Paste your Firebase web config (from Firebase console → Project settings → Your apps → web app). It looks like <code>{"apiKey":"...","projectId":"...",...}</code></p>
    <textarea id="cfgIn" rows="6" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:11px;font-family:monospace;font-size:.78rem;background:var(--bg);color:var(--ink)"></textarea>
    <button class="btn btn-primary" id="cfgBtn">Save &amp; Connect</button>
    <div class="err" id="cfgMsg" style="display:${msg?'block':'none'}">${esc(msg||'')}</div>
  </div>`;
  $("#cfgBtn").onclick=()=>{
    let cfg; try{ cfg=parseCfg($("#cfgIn").value); }catch(e){ $("#cfgMsg").style.display='block'; $("#cfgMsg").textContent='Could not read that config. Paste the whole { ... } block from Firebase.'; return; }
    if(!cfg.apiKey||!cfg.projectId){ $("#cfgMsg").style.display='block'; $("#cfgMsg").textContent='Config needs at least apiKey and projectId.'; return; }
    localStorage.setItem('ca_fb_config', JSON.stringify(cfg));
    bootFirebase(cfg);
  };
}
function bootFirebase(cfg){
  try{ const fa=initializeApp(cfg); auth=getAuth(fa); db=getFirestore(fa); }
  catch(e){ return setupScreen('Could not connect: '+e.message); }
  authLoad=async u=>{
    user=u; role=null; profile=null;
    if(u){
      try{
        const t=await getDoc(doc(db,'teachers',u.uid));
        if(t.exists()){ role='teacher'; profile=t.data(); try{ profile.isAdmin=(await getDoc(doc(db,'admins',u.uid))).exists(); }catch(e){ profile.isAdmin=false; } }
        else{
          const s=await getDoc(doc(db,'students',u.uid));
          if(s.exists()){ role='student'; profile=s.data(); }
          else { await signOut(auth); role=null; }
        }
      }catch(e){}
    }
    route(); busy(false);
  };
  busy(true);   // wait for Firebase to restore the saved login before drawing any page
  onAuthStateChanged(auth,u=>{ if(!signingUp) authLoad(u); });
}
setTheme(localStorage.getItem('ca_theme')||'light');

  $("#pw").oninput=e=>{

    f.style.width=(s*33+1)+'%';

  };
  $("#btn").onclick=async()=>{
    ["nm","nic","em","pw","pw2","mob","wa","sch","ctr","pay"].forEach(x=>$("#e-"+x).textContent='');
    $("#msg").innerHTML='';
    const nm=$("#nm").value.trim(), nic=$("#nic").value.trim().toUpperCase(),
          em=$("#em").value.trim().toLowerCase(), pw=$("#pw").value, pw2=$("#pw2").value;
    let bad=false;
    if(nm.length<3){$("#e-nm").textContent='Please enter your full name.';bad=true;}
    if(!NIC_RE.test(nic)){$("#e-nic").textContent='Invalid NIC. Use 9 digits + V/X (old) or 12 digits (new).';bad=true;}
    if(!EMAIL_RE.test(em)){$("#e-em").textContent='Please enter a valid email address.';bad=true;}
    if(pwScore(pw)<2){$("#e-pw").textContent='Use at least 8 characters with both letters and numbers.';bad=true;}
    if(pw!==pw2){$("#e-pw2").textContent='Passwords do not match.';bad=true;}

async function stuDash(){

  app.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><b style="font-size:1.05rem">🎓 ${esc(profile.fullName)}</b> <span class="pill brand">Student</span> ${profile.verified?'<span class="vbadge">✔ Verified</span>':'<span class="sub" style="display:inline">· pending verification</span>'}
        <div class="sub" style="margin:2px 0 0">${esc(profile.batch||BATCHES[0])}${profile.center?' · '+esc(profile.center):''}${profile.school?' · '+esc(profile.school):''}</div></div>
      <div style="display:none">
        <label style="margin:0">Subject:</label>
        <select id="subj" style="width:auto">
          <option${state.stuSubject==='All'?' selected':''}>All</option>
          ${SUBJECTS.map(s=>`<option${state.stuSubject===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="stuBody"><div class="card"><p class="sub">Loading your marks…</p></div></div>`;
  $("#subj").onchange=e=>{ state.stuSubject=e.target.value; drawStu(); };

  const q=query(collection(db,'papers'), where('published','==',true));
  const load=async()=>{
    const snap=await getDocs(q), ps=snap.docs.map(d=>({id:d.id,...d.data()})), nic=String(profile.nic||'').toUpperCase();
    await Promise.all(ps.map(async p=>{ p.scores={}; try{ const m=await getDoc(doc(db,'marks',p.id+'_'+nic)); if(m.exists()) p.scores[nic]=m.data().mark; }catch(e){} }));
    return ps; };
  const renderBody=papers=>{
    const rowsP=papers
      .filter(p=>(p.batch||BATCHES[0])===(profile.batch||BATCHES[0]))
      .filter(p=>state.stuSubject==='All'||p.subject===state.stuSubject)
      .map(p=>({p, m:p.scores?.[String(profile.nic||'').toUpperCase()]}))
      .filter(r=>r.m!=null)
      .sort((a,b)=>String(a.p.date||'').localeCompare(String(b.p.date||'')));
    let inner='';
    if(!rowsP.length){
      inner=`<div class="card"><p class="sub">📭 No published marks yet${state.stuSubject!=='All'?' for '+esc(state.stuSubject):''}. Your teacher will publish them here after each paper.</p></div>`;
    }else{
      inner=`<div class="card"><h2>📈 Progress — ${esc(state.stuSubject)}</h2><canvas id="c1"></canvas></div>
      <div class="card"><h2>📄 Paper-by-Paper Marks</h2><div class="tbl-wrap"><table>
        <tr><th>Date</th><th>Subject</th><th>Paper</th><th>Marks</th><th>%</th><th>Grade</th></tr>
        ${rowsP.map(r=>{const p=pct(r.m,r.p.max);return `<tr><td class="mono">${esc(r.p.date||'—')}</td><td>${esc(r.p.subject)}</td><td>${esc(r.p.title)}</td>
          <td class="mono"><b>${r.m}</b> / ${r.p.max}</td><td><span class="pill ${gCls(p)}">${p}%</span></td>
          <td><span class="pill ${gCls(p)}">${grade(p)}</span></td></tr>`;}).join('')}
      </table></div></div>`;
    }
    $("#stuBody").innerHTML=inner;
    try{ document.dispatchEvent(new CustomEvent('ca:student-marks',{detail:{name:profile.fullName,nic:profile.nic,email:profile.email,subject:state.stuSubject,
      rows:rowsP.map(r=>({title:r.p.title,subject:r.p.subject,date:r.p.date,mark:r.m,max:r.p.max,pct:pct(r.m,r.p.max)}))}})); }catch(e){}
    if(rowsP.length){
      const dark=document.documentElement.dataset.theme==='dark';
      charts.s1=new Chart($("#c1"),{type:'line',data:{labels:rowsP.map(r=>r.p.title),
        datasets:[{label:'My score %',data:rowsP.map(r=>pct(r.m,r.p.max)),
          borderColor:'#15803d', backgroundColor:'rgba(21,128,61,.12)', fill:true, tension:.35, pointRadius:5, pointBackgroundColor:'#22a06b'}]},
        options:{scales:{y:{min:0,max:100,title:{display:true,text:'Percentage'}}},
          plugins:{legend:{display:true},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y}%`}}}}});
    }
  };
  window.drawStu = () => load().then(renderBody).catch(e=>{ $("#stuBody").innerHTML=`<div class="card"><div class="err">${esc(friendly(e))}</div></div>`; });
  unsubStu=onSnapshot(q, snap=>renderBody(snap.docs.map(d=>({id:d.id,...d.data()}))), ()=>{});
  const first=await load().catch(()=>[]);
  renderBody(first);
}

/* ---- Clipart faces + ranking marquee ---- */
const FACES=['😀','😎','🤓','😊','🙂','😄','🧐','😇','🤩','😺','🦊','🐼','🐯','🐨','🦉','🐸'];
const FACE_BG=['#fde68a','#bfdbfe','#fbcfe8','#bbf7d0','#ddd6fe','#fed7aa','#a5f3fc','#fecaca'];
function faceOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return {e:FACES[h%FACES.length], bg:FACE_BG[(h>>3)%FACE_BG.length]}; }
function rankMarquee(students,papers){
  const paper=papers.find(p=>p.id===state.rankPaper)||papers[0];
  const r=paper?paperRanks(students,paper):[];
  if(!r.length) return `<div class="marq"><div class="marq-h">🏆 PAPER RANKINGS</div><p class="sub" style="padding:0 14px">Rankings for the latest paper will scroll here once you enter marks.</p></div>`;
  const medal=n=>n===1?'🥇':n===2?'🥈':n===3?'🥉':'#'+n;
  const items=r.map(x=>{ const f=faceOf(x.s.id);
    return `<div class="marq-item"><span class="face" style="background:${f.bg}">${f.e}</span><span><b>${medal(x.rank)} <a class="nl" href="#/student/${encodeURIComponent(x.s.nic)}">${esc(x.s.fullName)}</a></b><small>${x.m}/${paper.max} · ${x.pct}%</small></span></div>`; }).join('');
  return `<div class="marq"><div class="marq-h">🏆 ${esc(paper.title).toUpperCase()} — RANKINGS</div><div class="marq-track" style="animation-duration:${Math.max(25,r.length*4)}s">${items}${items}</div></div>`;
}

async function teacherDash(){

    app.innerHTML=`<div class="card auth-card"><h2>⏳ Awaiting verification</h2><p class="sub">Your instructor account is created. The site developer must verify it before you can enter marks.</p><button class="btn btn-primary" id="recheck">Check again</button></div>`;
    $("#recheck").onclick=async()=>{ try{ const t=await getDoc(doc(db,'teachers',user.uid)); if(t.exists()) profile={...t.data(),isAdmin:profile.isAdmin}; }catch(e){} teacherDash(); };
    return;
  }
  if(!profile.profileDone || state.editProfile){ state.editProfile=false; return teacherProfile(); }

  const papersAll=papSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  rosterAll.sort((a,b)=>a.fullName.localeCompare(b.fullName));

  const teachers=tchSnap?tchSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.fullName).localeCompare(String(b.fullName))):[];
  state.settings = setSnap?.exists()? setSnap.data() : {teacherSignupOpen:true};

  app.innerHTML = `
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div><b style="font-size:1.05rem">👩‍🏫 ${esc(profile.fullName||'Instructor')}</b> <span class="pill brand">${adm?'Developer':'Teacher'}</span> <button class="btn btn-ghost btn-sm" id="editProf">✏️ Profile</button>

    ${adm?`<select id="ctrSel" style="width:auto"><option>All</option>${state.lists.centers.map(c=>`<option${state.center===c?' selected':''}>${esc(c)}</option>`).join('')}</select>`:`<b>${esc(profile.center||'— (no center set)')}</b> <span class="sub" style="margin:0">· you only see students in your center</span>`}</div>

    ${adm?`<button data-tab="teachers" class="${state.tab==='teachers'?'active':''}">🧑‍🏫 Teachers</button><button data-tab="admin" class="${state.tab==='admin'?'active':''}">⚙️ Centers &amp; Payments</button>`:''}

  const tabs={students:tabStudents,marks:tabMarks,analytics:tabAnalytics,ranks:tabRanks,allmarks:tabAllMarks,teachers:tabTeachers,admin:tabAdmin};

    <div class="card"><h2>📄 Paper-by-paper</h2><div class="tbl-wrap"><table><tr><th>Date</th><th>Paper</th><th>Marks</th><th>%</th><th>Grade</th><th>Rank</th><th>Status</th></tr>
    ${rows.map(r=>`<tr><td class="mono">${esc(r.p.date||'—')}</td><td>${esc(r.p.title)}</td><td class="mono"><b>${r.m}</b> / ${r.p.max}</td><td><span class="pill ${gCls(r.pc)}">${r.pc}%</span></td><td><span class="pill ${gCls(r.pc)}">${grade(r.pc)}</span></td><td>${r.rank} / ${r.n}</td><td>${r.p.published?'Published':'Hidden'}</td></tr>`).join('')}</table></div></div>`
    :'<div class="card"><p class="sub">No marks entered for this student yet.</p></div>'}`;
    if(rows.length) charts.sv=new Chart($("#svC"),{type:'line',data:{labels:rows.map(r=>r.p.title),datasets:[{label:'Score %',data:rows.map(r=>r.pc),borderColor:'#15803d',backgroundColor:'rgba(21,128,61,.12)',fill:true,tension:.35,pointRadius:5,pointBackgroundColor:'#22a06b'}]},options:{scales:{y:{min:0,max:100}}}});

    $("#svDel").onclick=async()=>{

        busy(false); go('#/teacher/dashboard');
      }catch(e){ busy(false); alert(friendly(e)); }
    };

/* ---- Rankings tab (paper by paper) ---- */
function paperRanks(students,paper){
  const rows=students.map(s=>({s,m:paper.scores?.[s.id]})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);
  let rk=0,prev=null; rows.forEach((x,i)=>{ if(x.m!==prev){rk=i+1;prev=x.m;} x.rank=rk; x.pct=pct(x.m,paper.max); });
  return rows;
}
function tabRanks({students,papers}){
  const sel=papers.find(p=>p.id===state.rankPaper)||papers[0]||null;
  if(sel) state.rankPaper=sel.id;
  const rows=sel?paperRanks(students,sel):[];
  $("#tabBody").innerHTML=`<div class="card"><h2>🏅 Rankings by paper — ${esc(state.batch)}</h2>
    ${papers.length?`<label>Paper</label><select id="rkSel" style="width:auto">${papers.map(p=>`<option value="${p.id}"${p.id===sel.id?' selected':''}>${esc(p.title)} (${esc(p.date||'no date')})</option>`).join('')}</select>`:'<p class="sub">No papers yet.</p>'}
    ${rows.length?`<div class="tbl-wrap"><table><tr><th>Rank</th><th>Student</th><th>NIC</th><th>Center</th><th>Marks</th><th>%</th></tr>
    ${rows.map(x=>{const f=faceOf(x.s.id);return `<tr><td><b>${x.rank}</b></td><td><span class="face" style="background:${f.bg};width:30px;height:30px;font-size:1.1rem;display:inline-grid;margin-right:6px;vertical-align:middle">${f.e}</span><a class="nl" href="#/student/${encodeURIComponent(x.s.nic)}">${esc(x.s.fullName)}</a></td><td class="mono">${esc(x.s.nic)}</td><td>${esc(x.s.center||'—')}</td><td>${x.m} / ${sel.max}</td><td>${x.pct}%</td></tr>`;}).join('')}</table></div>`:(sel?'<p class="sub">No marks entered for this paper yet.</p>':'')}</div>`;
  if($("#rkSel")) $("#rkSel").onchange=e=>{ state.rankPaper=e.target.value; teacherDash(); };
}

    ${L[k].length?L[k].map((x,i)=>`<div class="paper-row"><b>${esc(x)}</b><button class="btn btn-danger btn-sm" data-rmv="${k}:${i}">Remove</button></div>`).join(''):'<p class="sub">None yet.</p>'}</div>`;
  $("#tabBody").innerHTML=block('centers','🏫 Exam Centers','e.g. Ratnapura Center')+block('payMethods','💳 Payment Methods','e.g. Bank deposit, Cash, Online');
  const save=async(k)=>{ busy(true); await setDoc(doc(db,'settings','lists'),{[k]:L[k]},{merge:true}); busy(false); teacherDash(); };
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const k=b.dataset.add, v=$("#in_"+k).value.trim(); if(!v||L[k].includes(v)) return; L[k]=[...L[k],v]; save(k); });
  document.querySelectorAll('[data-rmv]').forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.rmv.split(':'); L[k]=L[k].filter((_,j)=>j!==+i); save(k); });
}

/* ---- All Marks tab: every center, sortable ---- */
function tabAllMarks({papers,rosterAll}){
  const adm=!!profile.isAdmin, mine=profile.center||'';
  const sel=papers.find(p=>p.id===state.amPaper)||papers[0]||null; if(sel) state.amPaper=sel.id;
  const sort=state.amSort||'high';
  let rows=sel?Object.entries(sel.scores||{}).map(([nic,m])=>{ const mt=sel.meta?.[nic]||{}, r=rosterAll.find(x=>x.nic===nic)||{};
    return {nic,m,pc:pct(m,sel.max),name:mt.n||r.fullName||nic,center:(mt.c??r.center)||'—'}; }):[];
  const byHigh=[...rows].sort((a,b)=>b.m-a.m); let rk=0,pv=null; byHigh.forEach((x,i)=>{ if(x.m!==pv){rk=i+1;pv=x.m;} x.rank=rk; });
  if(sort==='high') rows=byHigh; else if(sort==='low') rows=[...byHigh].reverse(); else rows.sort((a,b)=>a.center.localeCompare(b.center)||b.m-a.m);
  const cs={}; rows.forEach(x=>{ (cs[x.center]??={n:0,t:0}); cs[x.center].n++; cs[x.center].t+=x.pc; });
  let last=null, body='';
  rows.forEach(x=>{
    if(sort==='center' && x.center!==last){ last=x.center; const c=cs[x.center];
      body+=`<tr><td colspan="6" style="background:var(--bg);font-weight:700">🏫 ${esc(x.center)} <span class="sub" style="display:inline">· ${c.n} students · average ${Math.round(c.t/c.n*10)/10}%</span></td></tr>`; }
    const can=adm||x.center===mine, nm=can?`<a class="nl" href="#/student/${encodeURIComponent(x.nic)}">${esc(x.name)}</a>`:esc(x.name);
    body+=`<tr><td><b>${x.rank}</b></td><td>${nm}</td><td class="mono">${esc(x.nic)}</td><td>${esc(x.center)}</td><td class="mono"><b>${x.m}</b> / ${sel.max}</td><td><span class="pill ${gCls(x.pc)}">${x.pc}%</span></td></tr>`; });
  $("#tabBody").innerHTML=`<div class="card"><h2>🌐 All marks — ${esc(state.batch)}</h2>
    ${papers.length?`<div class="row"><div><label>Paper</label><select id="amP">${papers.map(p=>`<option value="${p.id}"${p.id===sel.id?' selected':''}>${esc(p.title)} (${esc(p.date||'no date')})</option>`).join('')}</select></div>
    <div><label>Arrange</label><select id="amS"><option value="high"${sort==='high'?' selected':''}>Highest → Lowest</option><option value="low"${sort==='low'?' selected':''}>Lowest → Highest</option><option value="center"${sort==='center'?' selected':''}>Center by center</option></select></div></div>`:'<p class="sub">No papers yet.</p>'}
    ${rows.length?`<div class="tbl-wrap"><table><tr><th>Rank</th><th>Student</th><th>NIC</th><th>Center</th><th>Marks</th><th>%</th></tr>${body}</table></div>`:(sel?'<p class="sub">No marks entered for this paper yet.</p>':'')}</div>`;
  if($("#amP")){ $("#amP").onchange=e=>{ state.amPaper=e.target.value; teacherDash(); }; $("#amS").onchange=e=>{ state.amSort=e.target.value; teacherDash(); }; }
}

function drawMarksPane(students,papers){
  const pane=$("#marksPane"); if(!pane) return;
  const selPapers=papers.filter(p=>p.id===state.selPaper);

  if(!sel){ pane.innerHTML=''; return; }
  pane.innerHTML = `
  <div class="card">
    <h2>✏️ Marks — ${esc(sel.subject)}: ${esc(sel.title)} <span class="sub" style="display:inline">(max ${sel.max})</span> <span id="svLbl" class="saved" style="margin-left:8px"></span></h2>
    ${students.length?`<div class="tbl-wrap"><table><tr><th>Student</th><th>NIC</th><th>Marks / ${sel.max}</th><th>%</th><th>Grade</th></tr>
      ${students.map(s=>{
        const sc=sel.scores?.[s.id]; const p=sc!=null?pct(sc,sel.max):null;
        return `<tr><td><b><a class="nl" href="#/student/${encodeURIComponent(s.nic)}">${esc(s.fullName)}</a></b></td><td class="mono">${esc(s.nic)}</td>
          <td style="max-width:120px"><input type="number" min="0" max="${sel.max}" value="${sc??''}" data-mk="${s.id}"></td>
          <td>${p!=null?`<span class="pill ${gCls(p)}">${p}%</span>`:'—'}</td>
          <td>${p!=null?`<span class="pill ${gCls(p)}">${grade(p)}</span>`:'—'}</td></tr>`;
      }).join('')}</table></div>`:'<p class="sub">No students yet — add them in the Students tab using their NIC.</p>'}
  </div>`;
  document.querySelectorAll('[data-mk]').forEach(inp=>inp.onchange=async()=>{
    const nic=inp.dataset.mk, st=students.find(x=>x.id===nic);
    const v=inp.value===''?null:Math.max(0,Math.min(sel.max,parseInt(inp.value)||0));
    $("#svLbl").textContent='○ saving…';
    try{
      if(v==null){ delete sel.scores[nic]; await deleteDoc(doc(db,'marks',sel.id+'_'+nic)); }
      else{ sel.scores[nic]=v; await setDoc(doc(db,'marks',sel.id+'_'+nic),{pid:sel.id,nic,mark:v,name:st.fullName,center:st.center||'',batch:sel.batch||state.batch,by:profile.fullName||''}); }
      $("#svLbl").textContent='✓ saved';
    }catch(e){ $("#svLbl").textContent='⚠ '+friendly(e); }
  });
}

/* ---- Analytics tab ---- */
function computeStats(students,papers){
  const per=students.map(s=>{
    const sub={}, tot={g:0,m:0};
    SUBJECTS.forEach(x=>sub[x]={g:0,m:0});
    papers.forEach(p=>{
      const sc=p.scores?.[s.id]; if(sc==null) return;
      sub[p.subject].g+=sc; sub[p.subject].m+=p.max; tot.g+=sc; tot.m+=p.max;
    });
    const subP={}; SUBJECTS.forEach(x=>subP[x]=sub[x].m?pct(sub[x].g,sub[x].m):null);
    return {s, subP, overall:tot.m?pct(tot.g,tot.m):null};
  });
  const ranked=per.filter(x=>x.overall!=null).sort((a,b)=>b.overall-a.overall);
  ranked.forEach((x,i)=>x.rank = i>0 && x.overall===ranked[i-1].overall ? ranked[i-1].rank : i+1);
  const subAvg={}; SUBJECTS.forEach(x=>{
    const vals=per.map(p=>p.subP[x]).filter(v=>v!=null);
    subAvg[x]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
  });
  const bins=[0,0,0,0,0];
  ranked.forEach(x=>{ const p=x.overall; bins[p<20?0:p<40?1:p<60?2:p<80?3:4]++; });
  const attention=per.filter(x=>x.overall!=null && (x.overall<40 || SUBJECTS.some(s=>x.subP[s]!=null&&x.subP[s]<40)));
  return {per,ranked,subAvg,bins,attention};
}

    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{stepSize:1}}}}});
