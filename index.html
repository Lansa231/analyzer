<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Analyzer — A/L Science Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f2f7f9; --card:#ffffff; --ink:#122a35; --muted:#5b7280; --line:#e3ecf1;
  --brand:#0e7490; --brand2:#0d9488; --brand-soft:#e0f2f1;
  --good:#0f766e; --bad:#b91c1c; --warn:#b45309;
  --good-bg:#d7f0ea; --bad-bg:#fee2e2; --warn-bg:#fef3c7; --brand-bg:#e0f2f1;
  --shadow:0 8px 28px rgba(14,74,90,.10); --radius:16px;
}
[data-theme="dark"]{
  --bg:#0b1520; --card:#132433; --ink:#e6eef4; --muted:#8fa6b3; --line:#22394a;
  --brand:#2dd4bf; --brand2:#38bdf8; --brand-soft:#134e4a;
  --good:#2dd4bf; --bad:#f87171; --warn:#fbbf24;
  --good-bg:#0f3d36; --bad-bg:#4c1d1d; --warn-bg:#45320b; --brand-bg:#134e4a;
  --shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Inter',system-ui,sans-serif;}
body{background:var(--bg); color:var(--ink); min-height:100vh; transition:background .25s, color .25s;}
a{color:var(--brand); text-decoration:none;}
header{position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:12px 20px;}
.logo{font-weight:800; font-size:1.05rem; color:var(--ink); display:flex; align-items:center; gap:8px;}
.logo span{background:linear-gradient(120deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hdr-actions{display:flex; gap:8px; align-items:center;}
main{max-width:1040px; margin:0 auto; padding:24px 16px 80px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px;}
h1{font-size:1.5rem; letter-spacing:-.02em;}
h2{font-size:1.05rem; margin-bottom:14px;}
.sub{color:var(--muted); font-size:.9rem; margin-top:6px; line-height:1.6;}
label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:14px 0 5px;}
input,select{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:11px; font-size:.93rem; background:var(--bg); color:var(--ink);}
input:focus,select:focus{outline:none; border-color:var(--brand); background:var(--card);}
.btn{border:none; border-radius:11px; padding:11px 20px; font-weight:700; font-size:.92rem; cursor:pointer; transition:.15s; font-family:inherit;}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand2)); color:#fff; width:100%; margin-top:18px;}
.btn-primary:not(:disabled):hover{filter:brightness(1.08);}
.btn-ghost{background:var(--brand-bg); color:var(--brand);}
.btn-danger{background:var(--bad-bg); color:var(--bad);}
.btn-sm{padding:6px 13px; font-size:.8rem; border-radius:8px;}
.hero{padding:56px 28px; text-align:center;}
.hero .badge{display:inline-block; background:var(--brand-bg); color:var(--brand); font-weight:700; font-size:.75rem; letter-spacing:.08em;
  text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;}
.hero h1{font-size:2rem; margin-bottom:10px;}
.hero .sub{max-width:480px; margin:0 auto 26px;}
.hero-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.hero-btns .btn{width:auto; padding:13px 34px; margin:0;}
.auth-card{max-width:420px; margin:36px auto;}
.err{background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.ok{background:var(--good-bg); color:var(--good); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.field-err{color:var(--bad); font-size:.75rem; margin-top:4px; min-height:1em;}
.meter{height:6px; background:var(--line); border-radius:6px; margin-top:8px; overflow:hidden;}
.meter div{height:100%; border-radius:6px; transition:width .25s, background .25s;}
.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:15px; text-align:center;}
.stat .num{font-size:1.5rem; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:.75rem; color:var(--muted); margin-top:3px;}
table{width:100%; border-collapse:collapse; font-size:.88rem;}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--bg);}
tr:hover td{background:var(--bg);}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
.pill{display:inline-block; padding:3px 11px; border-radius:999px; font-size:.73rem; font-weight:700;}
.pill.good{background:var(--good-bg); color:var(--good);}
.pill.bad{background:var(--bad-bg); color:var(--bad);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.brand{background:var(--brand-bg); color:var(--brand);}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.tabs button{border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 18px; cursor:pointer; font-weight:700; font-size:.85rem; font-family:inherit;}
.tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
.row>div{flex:1; min-width:130px;}
.hint{font-size:.78rem; color:var(--muted); margin-top:10px; line-height:1.6;}
.switch{position:relative; width:42px; height:24px; display:inline-block; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:.2s;}
.slider:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--brand);}
.switch input:checked + .slider:before{transform:translateX(18px);}
.paper-row{display:flex; align-items:center; gap:14px; justify-content:space-between; flex-wrap:wrap; padding:13px 4px; border-bottom:1px solid var(--line);}
.paper-row:last-child{border-bottom:none;}
.bar-wrap{background:var(--line); border-radius:8px; height:8px; margin-top:6px; overflow:hidden;}
.bar{height:100%; border-radius:8px;}
canvas{max-height:320px;}
#loading{position:fixed; inset:0; background:rgba(10,20,28,.45); display:none; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px);}
#loading.show{display:flex;}
.spinner{width:44px; height:44px; border:4px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.list-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:.9rem;}
.list-item:last-child{border-bottom:none;}
.mono{font-variant-numeric:tabular-nums;}
.saved{color:var(--good); font-size:.78rem; font-weight:700;}
.mode-tag{font-size:.68rem; background:var(--warn-bg); color:var(--warn); padding:3px 10px; border-radius:999px; font-weight:700;}
@media(max-width:600px){
  .hero{padding:40px 18px;} .hero h1{font-size:1.5rem;}
  .card{padding:18px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">🧬 <span>Class Analyzer</span> <span style="font-size:.7rem;color:var(--muted);font-weight:600">A/L Science</span> <span class="mode-tag">LOCAL MODE</span></div>
  <div class="hdr-actions" id="hdrActions"></div>
</header>
<main id="app"></main>
<div id="loading"><div class="spinner"></div></div>

<script>
/* =====================================================================
   CLASS ANALYZER — LOCAL MODE  (zero-config: works on GitHub Pages,
   no Firebase needed. Data is stored in this browser via localStorage.)
   ===================================================================== */

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b>0 ? Math.round(a/b*1000)/10 : 0;
const SUBJECTS = ["Biology","Chemistry","Physics"];
const grade = p => p>=75?'A':p>=65?'B':p>=55?'C':p>=35?'S':'F';   // A/L boundaries
const gCls  = p => p>=75?'good':p>=55?'brand':p>=35?'warn':'bad';
const NIC_RE = /^(\d{9}[VvXx]|\d{12})$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const busy = on => $("#loading").classList.toggle('show', !!on);
let charts = {};
function killCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={}; }

/* -------- password hashing (SHA-256 + salt; fallback if unavailable) -------- */
async function hashPw(pw, salt){
  const msg = salt + '::' + pw;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return 's2' + [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<msg.length;i++){ const c=msg.charCodeAt(i); h1=(Math.imul(h1^c,0x01000193))>>>0; h2=(Math.imul(h2+c,0x85ebca6b)^h1)>>>0; }
  return 'fb'+(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
}
const newSalt = () => uid() + uid();

/* ============================== LOCAL DATABASE ============================== */
const DB_KEY='ca_local_db_v1';
function loadDB(){
  try{ return JSON.parse(localStorage.getItem(DB_KEY)) || {users:{},nicIndex:{},papers:[]}; }
  catch(e){ return {users:{},nicIndex:{},papers:[]}; }
}
let db = loadDB();
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ alert('Storage full or blocked — enable cookies/storage for this site.'); } }
function usersList(){ return Object.values(db.users); }
function findByEmail(em){ em=em.toLowerCase(); return usersList().find(u=>u.email===em) || null; }
function findByNIC(nic){ const id=db.nicIndex[nic.toUpperCase()]; return id?db.users[id]:null; }

/* ============================== SESSION ============================== */
const SES_KEY='ca_sess_v1';
let sess = null;
function loadSess(){ try{ sess=JSON.parse(sessionStorage.getItem(SES_KEY)); }catch(e){ sess=null; }
  if(sess && !db.users[sess.uid]) sess=null; }
function setSess(uid){ sess={uid}; sessionStorage.setItem(SES_KEY, JSON.stringify(sess)); }
function clearSess(){ sess=null; sessionStorage.removeItem(SES_KEY); }
const me = () => sess? db.users[sess.uid] : null;

/* ============================== THEME ============================== */
function setTheme(t){ document.documentElement.dataset.theme=t; localStorage.setItem('ca_theme',t); chartDefaults(); }
function chartDefaults(){
  const dark=document.documentElement.dataset.theme==='dark';
  Chart.defaults.color = dark ? '#8fa6b3' : '#5b7280';
  Chart.defaults.borderColor = dark ? 'rgba(143,166,179,.15)' : 'rgba(91,114,128,.12)';
}
const themeBtn = () => `<button class="btn btn-ghost btn-sm" id="themeBtn">${document.documentElement.dataset.theme==='dark'?'☀️ Light':'🌙 Dark'}</button>`;
function bindTheme(){ const b=$("#themeBtn"); if(b) b.onclick=()=>{ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); route(); }; }

/* ============================== ROUTER ============================== */
let state = { tab:'marks', selPaper:null, stuSubject:'All' };
window.addEventListener('hashchange', route);
function go(h){ if(location.hash===h) route(); else location.hash=h; }
function route(){
  killCharts();
  const r = { '':'landing','#/':'landing','#/login':'login','#/signup':'signup','#/forgot':'forgot',
              '#/dashboard':'stuDash','#/teacher':'teacherAuth','#/teacher/dashboard':'teacherDash',
              '#/teacher/forgot':'teacherForgot' }[location.hash] || 'landing';
  const u=me();
  if(r==='stuDash' && !(u&&u.role==='student')) return go('#/login');
  if(r==='teacherDash' && !(u&&u.role==='teacher')) return go('#/teacher');
  if(r==='landing' && u && u.role==='student') return go('#/dashboard');
  if(r==='teacherAuth' && u && u.role==='teacher') return go('#/teacher/dashboard');
  renderHdr(r);
  ({landing,login,signup,forgot,stuDash,teacherAuth,teacherForgot,teacherDash})[r]();
  window.scrollTo(0,0);
}
function renderHdr(r){
  const h=$("#hdrActions"), u=me();
  if(u && (r==='stuDash'||r==='teacherDash')){
    h.innerHTML=`<span class="pill brand">${u.role==='teacher'?'👩‍🏫 Teacher':'🎓 Student'}</span> ${themeBtn()} <button class="btn btn-danger btn-sm" id="logoutBtn">Log out</button>`;
    $("#logoutBtn").onclick=()=>{ clearSess(); go('#/'); };
  } else h.innerHTML=themeBtn();
  bindTheme();
}
window.addEventListener('storage', e=>{ if(e.key===DB_KEY){ db=loadDB(); if(!me()) clearSess(); route(); } }); // live sync between tabs

/* ============================== LANDING ============================== */
function landing(){
  const hasTeacher=usersList().some(u=>u.role==='teacher');
  app.innerHTML=`
  <div class="card hero">
    <div class="badge">A/L Science Stream · Biology · Chemistry · Physics</div>
    <h1>Track every paper.<br>Watch yourself improve.</h1>
    <p class="sub">Your teacher publishes marks paper-by-paper. Log in anytime to see your progress chart and full marks history — on your phone or computer.</p>
    <div class="hero-btns">
      <button class="btn btn-primary" id="bLogin">Log In</button>
      <button class="btn btn-ghost" id="bSignup" style="padding:13px 34px;font-size:.92rem">Sign Up</button>
    </div>
  </div>
  <div class="grid g4">
    <div class="card stat" style="margin:0"><div style="font-size:1.6rem">📈</div><div class="lbl" style="margin-top:6px">Progress charts per subject</div></div>
    <div class="card stat" style="margin:0"><div style="font-size:1.6rem">📄</div><div class="lbl" style="margin-top:6px">Paper-by-paper marks</div></div>
    <div class="card stat" style="margin:0"><div style="font-size:1.6rem">🔒</div><div class="lbl" style="margin-top:6px">Hashed passwords</div></div>
    <div class="card stat" style="margin:0"><div style="font-size:1.6rem">📱</div><div class="lbl" style="margin-top:6px">Works on any device</div></div>
  </div>
  ${hasTeacher?'':`<div class="card" style="text-align:center"><p class="sub" style="margin:0">Instructors: open the portal at <code>/#/teacher</code> to create your account and manage the class.</p></div>`}`;
  $("#bLogin").onclick=()=>go('#/login');
  $("#bSignup").onclick=()=>go('#/signup');
}

/* ============================== STUDENT AUTH ============================== */
function login(){
  app.innerHTML=`<div class="card auth-card">
    <h2>🎓 Student Login</h2>
    <label>Email or NIC number</label>
    <input id="idf" placeholder="you@email.com or 200012345678" autocomplete="username">
    <label>Password</label>
    <input id="pw" type="password" placeholder="Your password" autocomplete="current-password">
    <div style="text-align:right;margin-top:8px"><a href="#/forgot" style="font-size:.82rem">Forgot password?</a></div>
    <button class="btn btn-primary" id="btn">Log In</button>
    <div id="msg"></div>
    <p class="hint" style="text-align:center">New student? <a href="#/signup">Create an account</a></p>
  </div>`;
  $("#btn").onclick=async()=>{
    const msg=$("#msg"); msg.innerHTML=''; busy(true);
    await new Promise(r=>setTimeout(r,150));
    const ident=$("#idf").value.trim();
    let u=null, err='';
    if(!ident) err='Please enter your email or NIC.';
    else if(EMAIL_RE.test(ident)) u=findByEmail(ident);
    else if(NIC_RE.test(ident)) u=findByNIC(ident);
    else err='That does not look like a valid email or NIC number.';
    if(!err && !u) err='No account found. Please check your details or sign up.';
    if(!err && u.role!=='student') err='This is not a student account. Use the instructor portal instead.';
    if(!err){
      const h=await hashPw($("#pw").value, u.salt);
      if(h!==u.pwHash) err='Incorrect password. Try again or use "Forgot password".';
    }
    busy(false);
    if(err){ msg.innerHTML=`<div class="err">${esc(err)}</div>`; return; }
    setSess(u.id); go('#/dashboard');
  };
  $("#pw").addEventListener('keydown',e=>{ if(e.key==='Enter') $("#btn").click(); });
}

function signup(){
  app.innerHTML=`<div class="card auth-card">
    <h2>🎓 Student Sign Up</h2>
    <label>Full Name</label><input id="nm" placeholder="e.g. Kasun Perera">
    <div class="field-err" id="e-nm"></div>
    <label>NIC Number</label><input id="nic" placeholder="e.g. 123456789V or 200012345678" maxlength="12">
    <div class="field-err" id="e-nic"></div>
    <label>Email</label><input id="em" type="email" placeholder="you@email.com" autocomplete="email">
    <div class="field-err" id="e-em"></div>
    <label>Password</label><input id="pw" type="password" placeholder="Min 8 chars, letters + numbers" autocomplete="new-password">
    <div class="meter"><div id="meterFill" style="width:0"></div></div>
    <div class="field-err" id="e-pw"></div>
    <label>Confirm Password</label><input id="pw2" type="password" placeholder="Repeat password" autocomplete="new-password">
    <div class="field-err" id="e-pw2"></div>
    <button class="btn btn-primary" id="btn">Create Account</button>
    <div id="msg"></div>
    <p class="hint" style="text-align:center">Already registered? <a href="#/login">Log in</a></p>
  </div>`;
  const pwScore=v=>{let s=0; if(v.length>=8)s++; if(/[a-zA-Z]/.test(v)&&/\d/.test(v))s++; if(v.length>=12||/[^a-zA-Z0-9]/.test(v))s++; return s;};
  $("#pw").oninput=e=>{ const s=pwScore(e.target.value),f=$("#meterFill"); f.style.width=(s*33+1)+'%'; f.style.background=['#b91c1c','#b45309','#0e7490','#0f766e'][s]; };
  $("#btn").onclick=async()=>{
    ["nm","nic","em","pw","pw2"].forEach(x=>$("#e-"+x).textContent='');
    $("#msg").innerHTML='';
    const nm=$("#nm").value.trim(), nic=$("#nic").value.trim().toUpperCase(),
          em=$("#em").value.trim().toLowerCase(), pw=$("#pw").value, pw2=$("#pw2").value;
    let bad=false;
    if(nm.length<3){$("#e-nm").textContent='Please enter your full name.';bad=true;}
    if(!NIC_RE.test(nic)){$("#e-nic").textContent='Invalid NIC. Use 9 digits + V/X (old) or 12 digits (new).';bad=true;}
    if(!EMAIL_RE.test(em)){$("#e-em").textContent='Please enter a valid email address.';bad=true;}
    if(pwScore(pw)<2){$("#e-pw").textContent='Use at least 8 characters with both letters and numbers.';bad=true;}
    if(pw!==pw2){$("#e-pw2").textContent='Passwords do not match.';bad=true;}
    if(bad) return;
    busy(true); await new Promise(r=>setTimeout(r,150));
    let err='';
    if(findByNIC(nic)) err='This NIC is already registered. <a href="#/login">Log in instead</a>.';
    else if(findByEmail(em)) err='This email is already registered. <a href="#/login">Log in instead</a>.';
    if(err){ busy(false); $("#msg").innerHTML=`<div class="err">${err}</div>`; return; }
    const id=uid(), salt=newSalt();
    const u={id, fullName:nm, nic, email:em, salt, pwHash:await hashPw(pw,salt), role:'student', createdAt:Date.now()};
    db.users[id]=u; db.nicIndex[nic]=id; save();
    busy(false);
    setSess(id); go('#/dashboard');
  };
}

function forgot(){
  app.innerHTML=`<div class="card auth-card">
    <h2>🔑 Reset Password</h2>
    <p class="sub">Enter your NIC, email and a new password. (Local mode cannot send emails — identity is verified against your NIC + email.)</p>
    <label>NIC Number</label><input id="nic" placeholder="123456789V / 200012345678" maxlength="12">
    <label>Email</label><input id="em" type="email" placeholder="you@email.com">
    <label>New Password</label><input id="pw" type="password" placeholder="Min 8 chars, letters + numbers">
    <label>Confirm New Password</label><input id="pw2" type="password" placeholder="Repeat new password">
    <button class="btn btn-primary" id="btn">Reset Password</button>
    <div id="msg"></div>
    <p class="hint" style="text-align:center"><a href="#/login">← Back to login</a></p>
  </div>`;
  $("#btn").onclick=async()=>{
    const msg=$("#msg"); msg.innerHTML=''; busy(true); await new Promise(r=>setTimeout(r,150));
    const nic=$("#nic").value.trim().toUpperCase(), em=$("#em").value.trim().toLowerCase(),
          pw=$("#pw").value, pw2=$("#pw2").value;
    const u=findByNIC(nic);
    let err='';
    if(!u||u.email!==em) err='No account matches that NIC + email combination.';
    else if(u.role!=='student') err='This is not a student account.';
    else if(pw.length<8||!/([a-zA-Z].*\d|\d.*[a-zA-Z])/.test(pw)) err='New password must be 8+ characters with letters and numbers.';
    else if(pw!==pw2) err='Passwords do not match.';
    if(err){ busy(false); msg.innerHTML=`<div class="err">${esc(err)}</div>`; return; }
    u.salt=newSalt(); u.pwHash=await hashPw(pw,u.salt); save();
    busy(false);

/* ---- Analytics tab ---- */
function computeStats(students,papers){
  const per=students.map(s=>{
    const sub={}, tot={g:0,m:0};
    SUBJECTS.forEach(x=>sub[x]={g:0,m:0});
    papers.forEach(p=>{
      const sc=p.scores?.[s.id]; if(sc==null) return;
      sub[p.subject].g+=sc; sub[p.subject].m+=p.max; tot.g+=sc; tot.m+=p.max;
    });
    const subP={}; SUBJECTS.forEach(x=>subP[x]=sub[x].m?pct(sub[x].g,sub[x].m):null);
    return {s, subP, overall:tot.m?pct(tot.g,tot.m):null};
  });
  const ranked=per.filter(x=>x.overall!=null).sort((a,b)=>b.overall-a.overall);
  ranked.forEach((x,i)=>x.rank = i>0 && x.overall===ranked[i-1].overall ? ranked[i-1].rank : i+1);
  const subAvg={}; SUBJECTS.forEach(x=>{
    const vals=per.map(p=>p.subP[x]).filter(v=>v!=null);
    subAvg[x]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
  });
  const bins=[0,0,0,0,0];
  ranked.forEach(x=>{ const p=x.overall; bins[p<20?0:p<40?1:p<60?2:p<80?3:4]++; });
  const attention=per.filter(x=>x.overall!=null && (x.overall<40 || SUBJECTS.some(s=>x.subP[s]!=null&&x.subP[s]<40)));
  return {per,ranked,subAvg,bins,attention};
}

        ${SUBJECTS.map(s2=>`<td>${x.subP[s2]!=null?x.subP[s2]+'%':'—'}</td>`).join('')}
        <td><span class="pill ${gCls(x.overall)}">${x.overall}%</span></td>
        <td><span class="pill ${gCls(x.overall)}">${grade(x.overall)}</span></td></tr>`).join('')}
    </table></div>`:'<p class="sub">No marks entered yet.</p>'}
  </div>`;

  charts.c1=new Chart($("#cSubj"),{type:'bar',data:{labels:SUBJECTS,datasets:[{label:'Class average %',
    data:SUBJECTS.map(x=>st.subAvg[x]??0),backgroundColor:['#0e7490','#0d9488','#2563eb'],borderRadius:10}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y}%`}}},scales:{y:{min:0,max:100}}}});
  charts.c2=new Chart($("#cDist"),{type:'bar',data:{labels:['0–20%','21–40%','41–60%','61–80%','81–100%'],
    datasets:[{label:'Students',data:st.bins,backgroundColor:['#b91c1c','#b45309','#0e7490','#0d9488','#0f766e'],borderRadius:10}]},
    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{stepSize:1}}}}});

  $("#xls").onclick=()=>{
    const rankAoa=[['Rank','Name','NIC',...SUBJECTS.map(x=>x+' %'),'Overall %','Grade'],
      ...st.ranked.map(x=>[x.rank,x.s.fullName,x.s.nic||'',...SUBJECTS.map(s2=>x.subP[s2]??''),x.overall,grade(x.overall)])];
    const papAoa=[['Name','NIC',...papers.map(p=>`${p.subject} | ${p.title} (${p.date||'-'})`),'Overall %'],
      ...st.per.filter(x=>x.overall!=null).map(x=>[x.s.fullName,x.s.nic||'',
        ...papers.map(p=>p.scores?.[x.s.id]??''),x.overall])];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rankAoa),'Rankings');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(papAoa),'Paper-wise Marks');
    XLSX.writeFile(wb,'class-analyzer-results.xlsx');
  };
  $("#pdf").onclick=()=>{
    const { jsPDF }=window.jspdf; const d=new jsPDF();
    d.setFontSize(15); d.text('Class Analyzer — Class Rankings',14,16);
    d.setFontSize(9); d.setTextColor(120); d.text(`Generated ${new Date().toLocaleString()}`,14,22); d.setTextColor(0);
    d.autoTable({startY:28,head:[['Rank','Name','NIC',...SUBJECTS,'Overall %','Grade']],
      body:st.ranked.map(x=>[String(x.rank),x.s.fullName,x.s.nic||'',...SUBJECTS.map(s2=>x.subP[s2]!=null?x.subP[s2]+'%':'—'),x.overall+'%',grade(x.overall)])});
    d.save('class-analyzer-rankings.pdf');
  };
}

/* ============================== BOOT ============================== */
setTheme(localStorage.getItem('ca_theme')||'light');
chartDefaults();
loadSess();
route();
</script>
</body>
