<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K. Wellala Biology Paper Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f1f8f3; --card:#ffffff; --ink:#12281c; --muted:#5a7364; --line:#dfece4;
  --brand:#15803d; --brand2:#22a06b; --brand-soft:#e4f4e8;
  --good:#166534; --bad:#b91c1c; --warn:#b45309;
  --good-bg:#dcf3e3; --bad-bg:#fee2e2; --warn-bg:#fef3c7; --brand-bg:#e4f4e8;
  --shadow:0 8px 28px rgba(20,80,40,.10); --radius:16px;
  --tint-a:.20; --tint-b:.40;
}
[data-theme="dark"]{
  --bg:#0a1710; --card:#12261a; --ink:#e6f2ea; --muted:#8fb09a; --line:#1f3a2a;
  --brand:#4ade80; --brand2:#a3e635; --brand-soft:#14532d;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --good-bg:#12391f; --bad-bg:#4c1d1d; --warn-bg:#45320b; --brand-bg:#14532d;
  --shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Inter','Noto Sans Sinhala','Nirmala UI','Iskoola Pota',system-ui,sans-serif;}
body{background:var(--bg); color:var(--ink); min-height:100vh; transition:background .25s, color .25s;}
a{color:var(--brand); text-decoration:none;}
header{position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:12px 20px; transition:background .25s;}
.logo{text-decoration:none;text-transform:uppercase;letter-spacing:.05em;font-weight:800; font-size:1.05rem; color:var(--ink); display:flex; align-items:center; gap:8px;}
.logo span{background:linear-gradient(120deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hdr-actions{display:flex; gap:8px; align-items:center;}
main{max-width:1040px; margin:0 auto; padding:24px 16px 80px;}
main#app.landing-wide{max-width:none;padding:0}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px;}
h1{font-size:1.5rem; letter-spacing:-.02em;}
h2{font-size:1.05rem; margin-bottom:14px;}
.sub{color:var(--muted); font-size:.9rem; margin-top:6px; line-height:1.6;}
label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin:14px 0 5px;}
input,select{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:11px; font-size:.93rem; background:var(--bg); color:var(--ink);}
input:focus,select:focus{outline:none; border-color:var(--brand); background:var(--card);}
input.invalid{border-color:var(--bad);}
.btn{border:none; border-radius:11px; padding:11px 20px; font-weight:700; font-size:.92rem; cursor:pointer; transition:.15s; font-family:inherit;}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand2)); color:#fff; width:100%; margin-top:18px;}
.btn-primary:not(:disabled):hover{filter:brightness(1.08);}
.btn-ghost{background:var(--brand-bg); color:var(--brand);}
.btn-danger{background:var(--bad-bg); color:var(--bad);}
.btn-sm{padding:6px 13px; font-size:.8rem; border-radius:8px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.hero{padding:56px 28px; text-align:center;}
.hero .badge{display:inline-block; background:var(--brand-bg); color:var(--brand); font-weight:700; font-size:.75rem; letter-spacing:.08em;
  text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;}
.hero h1{font-size:2rem; margin-bottom:10px;}
.hero .sub{max-width:480px; margin:0 auto 26px;}
.hero-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
.hero-btns .btn{width:auto; padding:13px 34px; margin:0;}
.auth-card{max-width:420px; margin:36px auto;}
.err{background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.ok{background:var(--good-bg); color:var(--good); border-radius:10px; padding:10px 14px; font-size:.83rem; margin-top:14px; line-height:1.5;}
.field-err{color:var(--bad); font-size:.75rem; margin-top:4px; min-height:1em;}
.meter{height:6px; background:var(--line); border-radius:6px; margin-top:8px; overflow:hidden;}
.meter div{height:100%; border-radius:6px; transition:width .25s, background .25s;}
.grid{display:grid; gap:14px;}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:15px; text-align:center;}
.stat .num{font-size:1.5rem; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:.75rem; color:var(--muted); margin-top:3px;}
table{width:100%; border-collapse:collapse; font-size:.88rem;}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--bg);}
tr:hover td{background:var(--bg);}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
.pill{display:inline-block; padding:3px 11px; border-radius:999px; font-size:.73rem; font-weight:700;}
.pill.good{background:var(--good-bg); color:var(--good);}
.pill.bad{background:var(--bad-bg); color:var(--bad);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.brand{background:var(--brand-bg); color:var(--brand);}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.tabs button{border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px; padding:8px 18px; cursor:pointer; font-weight:700; font-size:.85rem; font-family:inherit;}
.tabs button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
.row>div{flex:1; min-width:130px;}
.hint{font-size:.78rem; color:var(--muted); margin-top:10px; line-height:1.6;}
.switch{position:relative; width:42px; height:24px; display:inline-block; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:.2s;}
.slider:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .slider{background:var(--brand);}
.switch input:checked + .slider:before{transform:translateX(18px);}
.paper-row{display:flex; align-items:center; gap:14px; justify-content:space-between; flex-wrap:wrap; padding:13px 4px; border-bottom:1px solid var(--line);}
.paper-row:last-child{border-bottom:none;}
.bar-wrap{background:var(--line); border-radius:8px; height:8px; margin-top:6px; overflow:hidden;}
.bar{height:100%; border-radius:8px;}
canvas{max-height:320px;}
#loading{position:fixed; inset:0; background:rgba(10,20,28,.45); display:none; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px);}
#loading.show{display:flex;}
.spinner{width:44px; height:44px; border:4px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.list-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); font-size:.9rem;}
.list-item:last-child{border-bottom:none;}
.mono{font-variant-numeric:tabular-nums;}
.saved{color:var(--good); font-size:.78rem; font-weight:700;}
@media(max-width:600px){
  .hero{padding:40px 18px;} .hero h1{font-size:1.5rem;}
  .card{padding:18px;}
}
.marq{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;padding:10px 0;position:relative}
.marq-h{font-size:.72rem;font-weight:800;color:var(--brand);letter-spacing:.06em;padding:0 14px 6px}
.marq-track{display:flex;width:max-content;animation:marq 40s linear infinite}
.marq:hover .marq-track{animation-play-state:paused}
.marq-item{display:flex;align-items:center;gap:9px;padding:0 22px;white-space:nowrap}
.face{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;border:2px solid var(--brand)}
.marq-item small{display:block;color:var(--muted);font-size:.72rem}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq-track{animation:none}.marq{overflow-x:auto}}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:.85rem}
.chk input{width:auto}
.site-foot{text-align:center;padding:22px 14px 28px;color:var(--muted);font-size:.8rem}
.site-foot b{color:var(--brand)}
.vbadge{background:#dcfce7;color:#166534;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.nl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.nl:hover{color:var(--brand)}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.bgfx span{position:absolute;bottom:-70px;opacity:.15;animation:floatUp linear infinite;will-change:transform}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bgfx{display:none}}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);max-width:980px;margin:28px auto;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.split .auth-card{max-width:none;margin:0;border-radius:0;box-shadow:none}
.side{position:relative;min-height:320px;background:linear-gradient(rgba(6,45,25,var(--tint-a)),rgba(6,45,25,var(--tint-b))),url('signup-photo.jpg') center/cover no-repeat,linear-gradient(135deg,#15803d,#22a06b);display:flex;align-items:flex-end}
.side-txt{padding:28px;color:#fff}.side-txt h2{color:#fff;margin:6px 0}.side-txt p{margin:0;opacity:.9;font-size:.9rem}
@media (max-width:760px){.split{grid-template-columns:1fr;margin:12px auto}.side{min-height:150px}}
.hero.photo{background:linear-gradient(rgba(6,45,25,var(--tint-a)),rgba(6,45,25,var(--tint-b))),url('hero-photo.jpg') center/cover no-repeat,linear-gradient(135deg,#15803d,#22a06b);color:#fff;min-height:380px;display:flex;align-items:center;padding:40px 36px;border-radius:var(--radius)}
.hero.photo .hero-in{max-width:540px;width:100%}
.hero.photo h1,.hero.photo .sub{color:#fff}.hero.photo .sub{opacity:.92;margin:0 0 24px}
.hero.photo .badge{background:rgba(255,255,255,.18);color:#fff}
.hero.photo .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.65)}
.hero.pos-left{justify-content:flex-start;text-align:left}.hero.pos-left .hero-btns{justify-content:flex-start}
.hero.pos-center{justify-content:center;text-align:center}.hero.pos-center .hero-in{margin:0 auto}.hero.pos-center .sub{margin:0 auto 24px}
.hero.pos-right{justify-content:flex-end;text-align:right}.hero.pos-right .hero-btns{justify-content:flex-end}
@media (max-width:760px){.hero.photo{min-height:320px;padding:28px 18px}}
.foot-contact{display:inline-block;margin-bottom:10px;padding:8px 18px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;font-size:.85rem}
.foot-contact:hover{opacity:.9}
.crow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}.crow .ic{font-size:1.5rem;line-height:1}
.crow a{color:var(--brand);font-weight:700;text-decoration:none;word-break:break-word}
.pdfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.pdfcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.pdfcard img,.pdfph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;font-size:2.6rem}
.pdfcard .pt{padding:8px 10px;font-weight:700;font-size:.85rem}.pdfcard .pb{display:flex;gap:6px;padding:0 10px 10px}
</style>

<!-- ============ LANDING STYLES ============ -->
<style id="landingStyles">

.lp .btn svg{width:17px;height:17px;flex:none}
.lp .btn-gold{background:linear-gradient(135deg,#d9a93a,#c99a2e);color:#231a05;box-shadow:0 4px 14px rgba(201,154,46,.32)}

.lp .btn-soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.lp .btn-soft:hover{border-color:var(--brand);color:var(--brand)}
.lp .btn-primary-solid{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 18px rgba(21,128,61,.28)}

.lp .btn-on-dark{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.55)}

.lp .btn-lg{padding:14px 30px;font-size:.98rem;border-radius:13px}

.lp-hero{position:relative;overflow:hidden;border-radius:0 0 26px 26px;margin:0 0 20px}
.lp-hero-bg{position:absolute;inset:0;background:
  linear-gradient(105deg,rgba(6,42,24,.34) 0%,rgba(6,42,24,.58) 62%,rgba(6,42,24,.74) 100%),
  radial-gradient(circle at 78% 28%,rgba(52,211,153,.30),transparent 55%),

.lp-hero-in{position:relative;z-index:2;padding:72px 40px 76px;max-width:660px;color:#fff}

.lp-hero h1{font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.12;letter-spacing:-.025em;font-weight:800;margin-bottom:18px;color:#fff;text-wrap:balance}
.lp-hero h1 em{font-family:Georgia,serif;font-style:italic;color:#fde68a;font-weight:600}
.lp-hero p.lead{color:rgba(255,255,255,.92);font-size:1.04rem;max-width:540px;margin-bottom:28px;line-height:1.65}
.lp-hero-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lp-hero-stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:38px;padding-top:24px;border-top:1px solid rgba(255,255,255,.18)}
.lp-hero-stats div strong{display:block;color:#fff;font-size:1.4rem;font-weight:800;line-height:1.1}
.lp-hero-stats div span{color:rgba(255,255,255,.72);font-size:.76rem;font-weight:500}

.lp-trust{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 24px;margin:0 auto 26px;position:relative;z-index:5;display:flex;justify-content:space-around;gap:16px;flex-wrap:wrap}
.lp-trust div{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.lp-trust div i{font-style:normal;font-size:1.25rem}
.lp-trust div b{color:var(--ink)}

.lp section{padding:44px 0}
.lp .kicker{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lp .kicker .idx{font-size:.7rem;font-weight:800;color:var(--brand);letter-spacing:.08em;background:var(--brand-soft);padding:4px 11px;border-radius:999px}
.lp .kicker .lbl{font-size:.72rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.lp h2.sec{font-size:clamp(1.5rem,2.8vw,2.1rem);letter-spacing:-.025em;line-height:1.2;font-weight:800;margin-bottom:12px;color:var(--ink);text-wrap:balance}
.lp h2.sec em{font-family:Georgia,serif;font-style:italic;color:var(--brand)}
.lp .sec-sub{color:var(--muted);font-size:.98rem;max-width:640px;margin-bottom:32px;line-height:1.65}

.lp .grid-class{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.lp .class-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.25s}

.lp .class-card:hover{transform:translateY(-4px);border-color:var(--brand-soft)}
.lp .class-card h3{font-size:1.1rem;font-weight:800;margin-bottom:4px;color:var(--ink)}

.lp .class-row:last-child{border-bottom:none}
.lp .class-row .t{font-weight:600;color:var(--ink)}
.lp .class-row .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.lp .tg-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}

.lp .tg-card .info b{display:block;font-size:.88rem;color:var(--ink)}
.lp .tg-card .info span{font-size:.74rem;color:var(--muted);display:block}
.lp .tg-card .info .join{font-size:.74rem;font-weight:700;color:#2AABEE;margin-top:2px}

.lp .teacher-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:40px;align-items:center}
.lp .teacher-photo{aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;position:relative;background:
  linear-gradient(150deg,rgba(6,42,24,.30),rgba(6,42,24,.55)),
  url('teacher-photo.jpg') center/cover no-repeat,
  linear-gradient(150deg,#0c4a27,#15803d 60%,#22a06b);box-shadow:var(--shadow);display:flex;align-items:flex-end;padding:26px}
.lp .teacher-photo .badge-float{position:relative;z-index:2;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);border-radius:13px;padding:13px 17px;color:#fff;width:100%}
.lp .teacher-photo .badge-float b{display:block;font-size:.95rem;margin-bottom:2px}
.lp .teacher-photo .badge-float span{font-size:.76rem;opacity:.9}
.lp .teacher-copy p{color:var(--muted);font-size:.94rem;line-height:1.75;margin-bottom:14px}
.lp .teacher-copy .si{font-family:'Noto Sans Sinhala',sans-serif}
.lp .teacher-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lp .teacher-tags span{font-size:.76rem;font-weight:700;background:var(--brand-soft);color:var(--brand);padding:6px 13px;border-radius:999px}

.lp .grid-feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.lp .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:.25s}
.lp .feat:hover{transform:translateY(-4px);border-color:var(--brand-soft)}

function parseCfg(txt){
  let t=String(txt||'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw new Error('no braces');
  t=t.slice(a,b+1)
     .replace(/\/\/.*$/gm,'')
     .replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'")
     .replace(/'([^']*)'/g,'"$1"')
     .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":')
     .replace(/,\s*([}\]])/g,'$1');
  return JSON.parse(t);
}

      try{
        const t=await getDoc(doc(db,'teachers',u.uid));

          role='teacher';
          profile=t.data();
          try{ profile.isAdmin=(await getDoc(doc(db,'admins',u.uid))).exists(); }catch(e){ profile.isAdmin=false; }

          const s=await getDoc(doc(db,'students',u.uid));

            role=null; profile=null;

    }
  };

    authLoad(u);
  });
}

function login(){
  app.innerHTML = `<div class="card auth-card">
    <h2>🎓 Student Login</h2>
    <label>Email, NIC or barcode number</label>
    <input id="idf" placeholder="you@email.com, NIC or barcode" autocomplete="username">
    <label>Password</label>
    <input id="pw" type="password" placeholder="Your password" autocomplete="current-password">
    <div style="text-align:right;margin-top:8px"><a href="#/forgot" style="font-size:.82rem">Forgot password?</a></div>
    <button class="btn btn-primary" id="btn">Log In</button>
    <div id="msg"></div>
    <p class="hint" style="text-align:center">New student? <a href="#/signup">Create an account</a></p>
  </div>`;
  $("#btn").onclick=async()=>{
    const msg=$("#msg"); msg.innerHTML=''; busy(true);
    try{
      let ident=$("#idf").value.trim(), email=ident;
      if(!ident) throw {message:'Please enter your email, NIC or barcode number.'};
      if(!EMAIL_RE.test(ident)){
        const id=ident.toUpperCase(); let found=null;
        if(NIC_RE.test(id)){ const n=await getDoc(doc(db,'nics',id)); if(n.exists()) found=n.data(); }
        if(!found && BC_RE.test(id)){ const b=await getDoc(doc(db,'barcodes',id)); if(b.exists()) found=b.data(); }
        if(!found) throw {message:'No account found for this NIC or barcode. Please sign up first.'};
        email=found.email;
      }
      await signInWithEmailAndPassword(auth, email, $("#pw").value);
    }catch(e){ busy(false); msg.innerHTML=`<div class="err">${esc(friendly(e))}</div>`; }
  };
  $("#pw").addEventListener('keydown',e=>{ if(e.key==='Enter') $("#btn").click(); });
}

async function getLists(){
  const x=await getDoc(doc(db,'settings','lists')).catch(()=>null), d=x?.exists()?x.data():{};
  return {centers:d.centers||[],payMethods:d.payMethods||[]};
}

async function stuDash(){
  if(!profile) return;

  const firstName = (profile.fullName||'Student').split(' ')[0];

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px"><button class="btn btn-ghost btn-sm" id="editMe">✏️ Edit my details</button><button class="btn btn-ghost btn-sm" id="reqCh">🔁 Change center / batch</button></div>
    <div id="editBox"></div>
    <div id="stuBody"><div class="card"><p class="sub">Loading your marks…</p></div></div>`;
  $("#editMe").onclick=()=>studentEditCard($("#editBox"),profile,false,()=>stuDash());
  $("#reqCh").onclick=()=>studentRequestCard($("#editBox"));
  { const fd=document.createElement('div'); fd.id='stuFiles'; $("#stuBody").insertAdjacentElement('afterend',fd); loadStuFiles(); }

  const q=query(collection(db,'papers'), where('published','==',true));
  const load=async()=>{
    const snap=await getDocs(q), ps=snap.docs.map(d=>({id:d.id,...d.data()})), nic=skeyOf(profile);
    await Promise.all(ps.map(async p=>{ p.scores={}; try{ const m=await getDoc(doc(db,'marks',p.id+'_'+nic)); if(m.exists()) p.scores[nic]=m.data().mark; }catch(e){} }));
    return ps; };

  const renderBody=papers=>{
    const rowsP=papers
      .filter(p=>(p.batch||BATCHES[0])===(profile.batch||BATCHES[0]))
      .filter(p=>state.stuSubject==='All'||p.subject===state.stuSubject)
      .map(p=>({p, m:p.scores?.[skeyOf(profile)]}))
      .filter(r=>r.m!=null)
      .sort((a,b)=>String(a.p.date||'').localeCompare(String(b.p.date||'')));

    if(!rowsP.length){
      $("#stuBody").innerHTML=`<div class="card"><p class="sub">📭 No published marks yet. Your teacher will publish them here after each paper.</p></div>`;
      return;
    }

    const marks = rowsP.map(r=>pct(r.m, r.p.max));
    const best = Math.max(...marks);
    const avg = Math.round(marks.reduce((a,b)=>a+b,0)/marks.length*10)/10;
    const latest = marks[marks.length-1];
    const bestRow = rowsP[marks.indexOf(best)];

    const bestCard = `
      <div class="ma-grid" style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:stretch">
        <div class="card" style="margin:0;display:flex;flex-direction:column">
          <h2 style="margin:0 0 14px">📈 Progress — ${esc(state.stuSubject)}</h2>
          <div style="background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px">
            <div class="gb-row" style="border:none;padding:0">
              <div class="gb-head" style="display:flex;justify-content:space-between;margin-bottom:8px">
                <span class="gb-title" style="font-weight:700;font-size:.9rem">Latest paper — ${esc(rowsP[rowsP.length-1].p.title)}</span>
                <span class="gb-date" style="color:var(--muted);font-size:.74rem">${esc(rowsP[rowsP.length-1].p.date||'—')}</span>
              </div>
              <div class="gb-track" style="height:14px;border-radius:999px;background:var(--line);overflow:hidden">
                <div style="height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:${latest}%"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.76rem;color:var(--muted)">
                <span>${rowsP[rowsP.length-1].m} / ${rowsP[rowsP.length-1].p.max} marks</span>
                <b style="color:var(--brand)">${latest}%</b>
              </div>
            </div>
          </div>
          <canvas id="c1" style="margin-top:auto"></canvas>
        </div>
        <div class="card" style="margin:0;display:flex;flex-direction:column;justify-content:center;text-align:center">

            <div class="ma-best-title" style="font-weight:800;font-size:.9rem;margin-top:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Best mark</div>
            <div class="ma-best-mark" style="font-size:1.7rem;font-weight:800;color:var(--brand);line-height:1.1">${best}%</div>
            <div class="sub" style="margin-top:4px;font-size:.78rem">${esc(bestRow.p.title)}</div>
            <div class="ma-mini" style="display:flex;gap:10px;margin-top:16px">

                <div class="l" style="font-size:.7rem;color:var(--muted);margin-top:2px">Papers sat</div>
              </div>
              <div style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px">
                <div class="n" style="font-weight:800;font-size:1.02rem;color:var(--brand)">${avg}%</div>
                <div class="l" style="font-size:.7rem;color:var(--muted);margin-top:2px">Average</div>
              </div>
            </div>
          </div>
        </div>

      <style>
        @keyframes maBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.06)}}

        @media(max-width:760px){.ma-grid{grid-template-columns:1fr!important}}
      </style>`;

    const rows = rowsP.map(r=>{
      const p = pct(r.m, r.p.max);
      // Distinct, high-contrast colors based on the grade
      const barColor = p>=75?'linear-gradient(90deg,#10b981,#34d399)': // A - Bright Green
                       p>=65?'linear-gradient(90deg,#3b82f6,#60a5fa)': // B - Blue
                       p>=55?'linear-gradient(90deg,#f59e0b,#fbbf24)': // C - Amber
                       p>=35?'linear-gradient(90deg,#f97316,#fb923c)': // S - Orange
                             'linear-gradient(90deg,#ef4444,#f87171)'; // F - Red
      return `<tr>
        <td class="mono">${esc(r.p.date||'—')}</td>
        <td>${esc(r.p.title)}</td>
        <td class="mono"><b>${r.m}</b> / ${r.p.max}</td>
        <td style="min-width:140px">
          <div class="bar-wrap" style="background:var(--line);border-radius:8px;height:8px;overflow:hidden">
            <div class="bar" style="height:100%;border-radius:8px;width:${p}%;background:${barColor};transition:width 1s ease"></div>
          </div>
        </td>
        <td><span class="pill ${gCls(p)}">${p}%</span></td>
        <td><span class="pill ${gCls(p)}">${grade(p)}</span></td>
      </tr>`;
    }).join('');

    $("#stuBody").innerHTML = bestCard + `
      <div class="card" style="margin-top:20px">
        <h2>📄 Paper-by-Paper Marks</h2>
        <div class="tbl-wrap">
          <table>
            <tr><th>Date</th><th>Paper</th><th>Marks</th><th>Progress</th><th>%</th><th>Grade</th></tr>
            ${rows}
          </table>
        </div>
      </div>`;

    charts.s1 = new Chart($("#c1"), {
      type:'line',
      data:{
        labels: rowsP.map(r=>r.p.title),
        datasets:[{
          label:'My score %',
          data: rowsP.map(r=>pct(r.m, r.p.max)),
          borderColor:'#15803d',
          backgroundColor:'rgba(21,128,61,.12)',
          fill:true, tension:.35, pointRadius:5, pointBackgroundColor:'#22a06b'
        }]
      },
      options:{
        scales:{ y:{ min:0, max:100, title:{display:true,text:'Percentage'} } },
        plugins:{ legend:{display:true}, tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y}%`}} }
      }
    });
  };

  window.drawStu = () => load().then(renderBody).catch(e=>{ $("#stuBody").innerHTML=`<div class="card"><div class="err">${esc(friendly(e))}</div></div>`; });
  unsubStu = onSnapshot(q, ()=>{ load().then(renderBody).catch(()=>{}); }, ()=>{});
  const first = await load().catch(()=>[]);
  renderBody(first);
}

const FACES=['😀','😎','🤓','😊','🙂','😄','🧐','😇','🤩','😺','🦊','🐼','🐯','🐨','🦉','🐸'];
const FACE_BG=['#fde68a','#bfdbfe','#fbcfe8','#bbf7d0','#ddd6fe','#fed7aa','#a5f3fc','#fecaca'];
function faceOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return {e:FACES[h%FACES.length], bg:FACE_BG[(h>>3)%FACE_BG.length]}; }
function rankMarquee(students,papers){
  const paper=papers.find(p=>p.id===state.rankPaper)||papers[0];
  const r=paper?paperRanks(students,paper):[];
  if(!r.length) return `<div class="marq"><div class="marq-h">🏆 PAPER RANKINGS</div><p class="sub" style="padding:0 14px">Rankings will scroll here once you enter marks.</p></div>`;
  const medal=n=>n===1?'🥇':n===2?'🥈':n===3?'🥉':'#'+n;
  const items=r.map(x=>{ const f=faceOf(x.s.id);
    return `<div class="marq-item"><span class="face" style="background:${f.bg}">${f.e}</span><span><b>${medal(x.rank)} <a class="nl" href="#/student/${encodeURIComponent(x.s.nic)}">${esc(x.s.fullName)}</a></b><small>${x.m}/${paper.max} · ${x.pct}%</small></span></div>`; }).join('');
  return `<div class="marq"><div class="marq-h">🏆 ${esc(paper.title).toUpperCase()} — RANKINGS</div><div class="marq-track" style="animation-duration:${Math.max(25,r.length*4)}s">${items}${items}</div></div>`;
}

function paperRanks(students,paper){
  const rows=students.map(s=>({s,m:paper.scores?.[s.id]})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);
  let rk=0,prev=null; rows.forEach((x,i)=>{ if(x.m!==prev){rk=i+1;prev=x.m;} x.rank=rk; x.pct=pct(x.m,paper.max); });
  return rows;
}
const batchKey=b=>String(b).split(' ')[0];
const avgOf=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
const GRADE_LEGEND='A 75+ · B 65–74 · C 55–64 · S 35–54 · F below 35';
function studentsFromMarks(papers){
  const map={};
  papers.forEach(p=>Object.entries(p.scores||{}).forEach(([nic,m])=>{
    const mt=p.meta?.[nic]||{}, s=(map[nic]??={nic,id:nic,fullName:nic,center:'',marks:{}});
    if(mt.n){ s.fullName=mt.n; s.center=mt.c||''; }
    s.marks[p.id]=pct(m,p.max);
  }));
  const order=[...papers].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  return Object.values(map).map(s=>{
    const seq=order.filter(p=>s.marks[p.id]!=null).map(p=>s.marks[p.id]);
    s.n=seq.length; s.avg=avgOf(seq); s.last=s.n?seq[s.n-1]:null; s.prev=s.n>1?seq[s.n-2]:null; return s; });
}
function rankRows(rows){ rows.sort((a,b)=>b.v-a.v); let rk=0,pv=null; rows.forEach((x,i)=>{ if(x.v!==pv){rk=i+1;pv=x.v;} x.rank=rk; }); return rows; }

  if($("#rkV")){ $("#rkV").onchange=e=>{ state.rkView=e.target.value; teacherDash(); }; $("#rkG").onchange=e=>{ state.rkGroup=e.target.value; teacherDash(); }; }

  <div class="card"><h2>📄 Paper-by-paper average</h2>
    ${pS.length?`<canvas id="cPap" style="max-height:260px"></canvas><div class="tbl-wrap" style="margin-top:12px"><table><tr><th>Paper</th><th>Date</th><th>Students</th><th>Average</th><th>Highest</th><th>Lowest</th></tr>
    ${pS.map(x=>`<tr><td><b>${esc(x.p.title)}</b></td><td class="mono">${esc(x.p.date||'—')}</td><td>${x.n}</td><td>${x.avg!=null?`<span class="pill ${gCls(x.avg)}">${x.avg}%</span>`:'—'}</td><td>${x.hi??'—'}</td><td>${x.lo??'—'}</td></tr>`).join('')}</table></div>`:'<p class="sub">No papers yet.</p>'}</div>
  <div class="card"><h2>🏆 Top performers</h2>
      ${ranked.slice(0,5).map(x=>`<div class="list-item"><span><b>${x.rank}.</b> ${nameLink(x.nic,x.fullName,x.center)}</span><span class="pill ${gCls(x.v)}">${x.v}% · ${grade(x.v)}</span></div>`).join('')||'<p class="sub">No marks yet.</p>'}</div>
  <div class="card"><h2>📋 Class rankings (overall average)</h2>
    ${ranked.length?`<div class="tbl-wrap"><table><tr><th>Rank</th><th>Name</th><th>NIC</th><th>Center</th><th>Papers</th><th>Average</th><th>Grade</th></tr>
    ${ranked.map(x=>`<tr><td><b>#${x.rank}</b></td><td>${nameLink(x.nic,x.fullName,x.center)}</td><td class="mono">${esc(x.nic)}</td><td>${esc(x.center||'—')}</td><td>${x.n}</td><td><span class="pill ${gCls(x.v)}">${x.v}%</span></td><td><span class="pill ${gCls(x.v)}">${grade(x.v)}</span></td></tr>`).join('')}</table></div>`:'<p class="sub">No marks entered yet.</p>'}</div>`;
  if($("#cPap")) charts.c1=new Chart($("#cPap"),{type:'bar',data:{labels:pS.map(x=>x.p.title),datasets:[{label:'Average %',data:pS.map(x=>x.avg??0),backgroundColor:'#22a06b',borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});
  if($("#xls")) $("#xls").onclick=()=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Rank','Name','NIC','Center','Papers','Average %','Grade'],...ranked.map(x=>[x.rank,x.fullName,x.nic,x.center,x.n,x.v,grade(x.v)])]),'Rankings');
    XLSX.writeFile(wb,'class-analytics.xlsx');
  };
  if($("#pdf")) $("#pdf").onclick=()=>{
    const { jsPDF }=window.jspdf; const d=new jsPDF();
    d.setFontSize(15); d.text('S.K. Wellala Biology Paper Class — '+state.batch+' Rankings',14,16);
    d.autoTable({startY:28,head:[['Rank','Name','NIC','Center','Papers','Average','Grade']],body:ranked.map(x=>[String(x.rank),x.fullName,x.nic,x.center||'—',String(x.n),x.v+'%',grade(x.v)])});
    d.save('class-rankings.pdf');
  };
}
chartDefaults();
</script>
</body>
</html>
