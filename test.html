<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<body style="font-family:sans-serif;padding:16px">
<h3>API test 2 </h3>
<pre id="out">Running...</pre>
<script>
const URL_ = "https://odd-paper-03f0.tm936763.workers.dev/api";
const out = document.getElementById('out');
const log = t => out.textContent += "\n" + t;
(async () => {
  out.textContent = "Page origin: " + location.origin;
  try { const r = await fetch(URL_); log("GET: " + r.status + " " + (await r.text())); }
  catch (e) { log("GET FAILED: " + e); }
  try {
    const r = await fetch(URL_, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: "get", col: "settings", id: "registration" })
    });
    log("POST: " + r.status + " " + (await r.text()));
  } catch (e) { log("POST FAILED: " + e); }
})();
</script>
